name: Build Debug APK

# ==============================================================================
# Flujo de Integración Continua (CI) en GitHub Actions
# Propósito: Compilar el APK de depuración (Debug) desde cero, sin caché,
#            descargando dependencias de C++ (NDK 28 / CMake 3.31), Rust 2024
#            y GeckoView Omni de Mozilla, generando firma debug.keystore limpia
#            y transfiriendo el APK compilado directamente al teléfono móvil
#            (carpeta /storage/emulated/0/Navegador) a través de Tailscale + SFTP.
# ==============================================================================

on:
  workflow_dispatch:
    # Activación exclusivamente MANUAL desde la interfaz de GitHub en el móvil

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Compilar APK Debug y Enviar al Teléfono
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Descarga completa del código fuente del repositorio
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Configuración del entorno Java JDK 17 (sin caché)
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Sin caché para asegurar compilación limpia e independiente

      # 3. Configuración de CMake y Android NDK para C++ (C++26 / C23)
      - name: Instalar dependencias de C++ (NDK r28 y CMake)
        run: |
          echo "============================================================"
          echo "Instalando NDK 28 y CMake para compilación C++ nativa..."
          echo "============================================================"
          
          # Instalar CMake 3.31+ mediante pip para coincidir con build.gradle.kts
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install "cmake>=3.31.0" --break-system-packages
          which cmake
          cmake --version

          # Aceptar licencias del SDK de Android
          yes | sdkmanager --licenses || true

          # Instalar versión exacta de NDK y CMake especificadas en build.gradle.kts
          echo "Instalando Android NDK 28.2.13676358 y CMake 3.31.6..."
          yes | sdkmanager --install "cmake;3.31.6" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" || true

          # Configurar variables de entorno para NDK
          if [ -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
            echo "✅ NDK 28.2.13676358 detectado y configurado correctamente."
          else
            echo "⚠️ Directorio específico de NDK no encontrado en ruta estándar, buscando en ndk/..."
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
            if [ -n "$NDK_DIR" ]; then
              echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
              echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
              echo "Usando NDK encontrado: $NDK_DIR"
            fi
          fi

      # 4. Configuración del toolchain de Rust para módulos nativos (core-native)
      - name: Instalar Rust y targets de Android (32 y 64 bits)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      # 5. Verificación del módulo nativo Rust
      - name: Verificar compilación del crate Rust (core-native)
        run: |
          echo "Verificando core-native con Cargo (Rust Edition 2024)..."
          cargo check --manifest-path core-native/Cargo.toml --verbose

      # 6. Configuración de Gradle (sin caché)
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true # Sin caché, como se requirió explícitamente

      # 7. Descarga y resolución de dependencias (GeckoView Omni de Mozilla y AndroidX)
      - name: Descargar dependencias de GeckoView y Maven
        run: |
          echo "Descargando dependencias de GeckoView Omni desde Mozilla Maven..."
          gradle dependencies --no-build-cache --no-daemon || true

      # 8. Generación forzada de firma debug.keystore desde cero usando el script .sh
      - name: Generar firma debug.keystore desde 0 (Sin esperar claves previas)
        run: |
          echo "Ejecutando script de generación obligatoria de firma..."
          chmod +x ./generate_debug_keystore.sh
          ./generate_debug_keystore.sh debug.keystore

      # 9. Compilación del APK Debug
      - name: Compilar APK Debug con Gradle
        run: |
          echo "Iniciando ensamblado de APK Debug..."
          gradle :app:assembleDebug \
            --no-build-cache \
            --no-daemon \
            --stacktrace

      # 10. Validar y verificar el APK generado
      - name: Verificar APK generado
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "============================================================"
            echo "✅ ¡APK Debug compilado exitosamente!"
            echo "📁 Ubicación: $APK_PATH"
            echo "⚖️  Tamaño: $APK_SIZE"
            echo "============================================================"
          else
            echo "❌ Error: No se encontró el archivo $APK_PATH tras la compilación."
            exit 1
          fi

      # 11. Conexión segura a Tailscale (Red Privada P2P hacia el teléfono)
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        continue-on-error: true

      # 12. Transferencia directa del APK a la carpeta /Navegador del teléfono vía SFTP/SCP
      - name: Transferir APK a la carpeta /Navegador del teléfono
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          PHONE_IP: ${{ secrets.PHONE_IP }}
          SSH_USER: ${{ secrets.SSH_USER || 'github' }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '2222' }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ] || [ -z "$PHONE_IP" ] || [ -z "$SSH_PASSWORD" ]; then
            echo "⚠️ Secretos de conexión (TAILSCALE_AUTHKEY, PHONE_IP o SSH_PASSWORD) no detectados."
            echo "Saltando transferencia P2P directa. El APK estará disponible en los artefactos."
            exit 0
          fi

          echo "============================================================"
          echo "📲 Iniciando transferencia directa P2P hacia el móvil..."
          echo "============================================================"
          sudo apt-get update -y && sudo apt-get install -y sshpass

          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"

          echo "🔍 Verificando estado de la red privada Tailscale..."
          tailscale status || true

          echo "📡 Probando conectividad con el teléfono ($PHONE_IP)..."
          tailscale ping -c 3 "$PHONE_IP" || true

          # Opciones de compatibilidad para servidores SSH/SFTP en Android (The Olive Tree App)
          # Habilita compatibilidad con algoritmos de intercambio de claves y cifrados heredados de Java
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=10 -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group14-sha256,diffie-hellman-group-exchange-sha256 -o HostKeyAlgorithms=+ssh-rsa,rsa-sha2-256,rsa-sha2-512"

          # Archivo por lotes SFTP (Protocolo nativo de la app "SSH Server")
          # Como el Alias "/" apunta a /storage/emulated/0/Navegador, colocarlo en la raíz lo guarda en esa carpeta
          printf "put %s app-debug.apk\nbye\n" "$APK_SRC" > /tmp/sftp_put.txt

          echo "🚀 Transfiriendo APK por SFTP nativo a $SSH_USER@$PHONE_IP:$SSH_PORT..."
          TRANSFER_SUCCESS=false

          if sshpass -p "$SSH_PASSWORD" sftp -P "$SSH_PORT" $SSH_OPTS -b /tmp/sftp_put.txt "${SSH_USER}@${PHONE_IP}"; then
            TRANSFER_SUCCESS=true
            echo "✅ Transferencia exitosa vía SFTP (alias raíz)."
          else
            echo "⚠️ SFTP directo falló. Intentando con ruta absoluta..."
            printf "put %s /storage/emulated/0/Navegador/app-debug.apk\nbye\n" "$APK_SRC" > /tmp/sftp_put_full.txt
            if sshpass -p "$SSH_PASSWORD" sftp -P "$SSH_PORT" $SSH_OPTS -b /tmp/sftp_put_full.txt "${SSH_USER}@${PHONE_IP}"; then
              TRANSFER_SUCCESS=true
              echo "✅ Transferencia exitosa vía SFTP (ruta absoluta)."
            else
              echo "⚠️ Reintentando mediante SCP con opciones de compatibilidad..."
              if sshpass -p "$SSH_PASSWORD" scp -P "$SSH_PORT" $SSH_OPTS "$APK_SRC" "${SSH_USER}@${PHONE_IP}:app-debug.apk" || \
                 sshpass -p "$SSH_PASSWORD" scp -P "$SSH_PORT" $SSH_OPTS "$APK_SRC" "${SSH_USER}@${PHONE_IP}:/storage/emulated/0/Navegador/app-debug.apk"; then
                TRANSFER_SUCCESS=true
                echo "✅ Transferencia exitosa vía SCP."
              fi
            fi
          fi

          if [ "$TRANSFER_SUCCESS" = true ]; then
            echo "============================================================"
            echo "🎉 ¡Transferencia completada! El APK está en tu carpeta /Navegador."
            echo "============================================================"
          else
            echo "============================================================"
            echo "⚠️ AVISO: No se pudo conectar con el servidor SSH de tu teléfono."
            echo "Posibles causas a revisar en tu móvil:"
            echo " 1. ¿Presionaste el botón Play (▶️) en la app SSH Server?"
            echo " 2. ¿Tailscale está encendido y conectado en tu teléfono?"
            echo " 3. ¿El teléfono estaba bloqueado o cerró la app en segundo plano?"
            echo "El APK compilado se ha guardado como artefacto descargable en GitHub."
            echo "============================================================"
          fi

      # 13. Subir el APK Debug como artefacto descargable en GitHub (Respaldo)
      - name: Subir APK Debug como Artefacto (Respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
